name: 任务卡
description: 一件有明确验证点、能判定真假的事
title: "[W?] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **一件事只填一张卡。** 验证点必须写成能被眼睛判定真假的一句话
        （"能读到位置" ✓，"完成驱动开发" ✗）。

  - type: input
    id: goal
    attributes:
      label: 目标
      description: 做完之后世界有什么不一样，一句话
      placeholder: H50 六轴控制环能在 100Hz 下平滑执行上位机下发的目标角
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 验证点（怎么算做完）
      description: 逐条列出，组会照着念一遍就能判定
      placeholder: |
        - [ ] 上位机连续发 100 帧目标角，无丢帧
        - [ ] 示波器/OLED 确认控制环周期 ≤10ms
        - [ ] 6 个舵机读回角度与目标角偏差 <2°
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: 泳道
      description: 对应 PROGRESS.md 第 1 节
      options:
        - lane:hw 硬件结构
        - lane:fw 下位机固件
        - lane:sw 上位机算法
        - lane:ai 数据训练
        - lane:doc 文档答辩
    validations:
      required: true

  - type: input
    id: plan
    attributes:
      label: 预计完成
      description: 日期，或写 "W3 结束"
      placeholder: 2026-11-29（W2 结束）
    validations:
      required: true

  - type: textarea
    id: blocks
    attributes:
      label: 我阻塞谁 / 谁阻塞我
      description: |
        写清楚"要等谁的哪个动作"。**有内容就务必同时打 `blocked` 标签**，
        这是组长每周只清一遍的那一列。没有就填"无"。
      placeholder: 等 #14 换上拉电阻后重测；我完成后解锁 #18 联调
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 相关
      description: 方案文档章节、协议帧、资料包路径、参考链接
      render: shell
      placeholder: |
        方案 §7 软件模块划分
        塔克 ROS2 源码 usb_link.c 帧格式
