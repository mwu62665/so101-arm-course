name: 任务卡
description: 一件有明确验证点、能判定真假的事
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **一件事只填一张卡。** 验证点必须写成能被眼睛判定真假的一句话
        （"能读到位置" ✓，"完成驱动开发" ✗）。

  - type: input
    id: goal
    attributes:
      label: 目标
      description: 做完之后世界有什么不一样，一句话
      placeholder: 六路舵机都能响应上位机下发的目标角
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 验证点（怎么算做完）
      description: 逐条列出，组会照着念一遍就能判定
      placeholder: |
        - [ ] 连续发 100 帧指令，无丢帧
        - [ ] 读回角度与目标角偏差 <2°
        - [ ] 演示过程可投屏
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: 泳道
      description: 对应 PROGRESS.md 第 1 节
      options:
        - lane:hw 硬件结构
        - lane:fw 下位机固件
        - lane:sw 上位机算法
        - lane:ai 数据训练
        - lane:doc 文档答辩
    validations:
      required: true

  - type: input
    id: plan
    attributes:
      label: 预计完成
      description: 日期；排期没定就填 "未排期"
      placeholder: 未排期
    validations:
      required: true

  - type: textarea
    id: blocks
    attributes:
      label: 我阻塞谁 / 谁阻塞我
      description: |
        写清楚"要等谁的哪个动作"。**有内容就务必同时打 `blocked` 标签**，
        这是组长每周只清一遍的那一列。没有就填"无"。
      placeholder: 等 #4 完成后才能开始联调
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 相关
      description: 项目规划.md 的条目、资料包路径、参考链接
      render: shell
      placeholder: |
        项目规划.md 已确定第 2 项（飞特舵机）
        本地资料：D:/...
